name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://workspace:workspace-local@localhost:5434/workspace_test
      REDIS_URL: redis://localhost:6381
      TEST_DATABASE_URL: postgres://workspace:workspace-local@localhost:5434/workspace_test
      TEST_REDIS_URL: redis://localhost:6381
      E2E_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Start isolated test services
        run: docker compose -p commonplace --profile test up -d --wait postgres-test redis-test
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against built application
        run: npm run test:e2e
      - name: Build Docker images
        run: docker compose -p commonplace build server web
      - name: Start isolated packaged application
        run: docker compose -p commonplace-verify -f compose.verify.yaml -f compose.cluster.yaml up -d --build --wait
      - name: Browser tests against final Docker images
        env:
          E2E_EXTERNAL: '1'
          E2E_BASE_URL: http://localhost:3100
          DATABASE_URL: postgres://workspace:workspace-local@localhost:15434/workspace_verify_test
          E2E_CLUSTER_WEBSOCKETS: ws://localhost:4100/collaboration,ws://localhost:4101/collaboration,ws://localhost:4102/collaboration,ws://localhost:4103/collaboration
        run: npm run test:e2e
      - name: Packaged Redis outage and gateway failover verification
        run: npm run test:cluster:packaged
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Stop test services
        if: always()
        run: |
          docker compose -p commonplace-verify -f compose.verify.yaml -f compose.cluster.yaml down
          docker compose -p commonplace --profile test down
