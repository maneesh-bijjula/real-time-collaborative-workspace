name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run test:operations
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Isolated production build and browser tests
        run: npm run test:e2e
      - name: Build Docker images
        run: docker compose -p commonplace build server web
      - name: Start isolated packaged application
        run: docker compose -p commonplace-verify -f compose.verify.yaml -f compose.cluster.yaml up -d --build --wait
      - name: Browser tests against final Docker images
        env:
          E2E_EXTERNAL: '1'
          E2E_BASE_URL: http://localhost:3100
          DATABASE_URL: postgres://workspace:workspace-local@localhost:15434/workspace_verify_test
          E2E_CLUSTER_WEBSOCKETS: ws://localhost:4100/collaboration,ws://localhost:4101/collaboration,ws://localhost:4102/collaboration,ws://localhost:4103/collaboration
        run: npm run test:e2e
      - name: Packaged Redis outage and gateway failover verification
        run: npm run test:cluster:packaged
      - name: Fifty-client correctness and controller-isolation smoke (no performance claim)
        run: npm run benchmark:smoke -- --controller-pause-ms 800
      - name: Backup, restore, migration failure and fresh-client recovery drill
        run: npm run test:release
      - name: Record exact source and final-image inventory
        run: npm run release:manifest -- --project commonplace-verify --file compose.verify.yaml --file compose.cluster.yaml --output test-results/release-inventory --require-source-match
      - name: Validate operational alerts
        run: |
          docker run --rm --network none -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.15.1 check config --syntax-only /etc/prometheus/prometheus.yml
          docker run --rm --network none -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.15.1 check rules /etc/prometheus/alerts.yml
          docker run --rm --network none -v "$PWD/ops/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint /bin/promtool prom/prometheus:v3.15.1 test rules alerts.test.yml
      - name: Validate production proxy template with temporary certificates
        run: npm run test:proxy
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Stop test services
        if: always()
        run: |
          docker compose -p commonplace-verify -f compose.verify.yaml -f compose.cluster.yaml down
