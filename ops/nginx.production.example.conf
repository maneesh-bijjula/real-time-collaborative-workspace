# Host nginx example. Replace the domain/certificate paths; app ports stay on
# loopback. Set TRUSTED_PROXY_CIDRS to the exact edge peer seen by the Node API.
map $http_upgrade $commonplace_connection {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    server_name commonplace.example.com;
    ssl_certificate /etc/letsencrypt/live/commonplace.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commonplace.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~ ^/(metrics|health|ready|live)(/|$) { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /collaboration {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $commonplace_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
