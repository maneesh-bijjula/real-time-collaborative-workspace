global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: commonplace
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/commonplace_metrics_token
    static_configs:
      - targets: ['server:4000', 'server2:4000', 'server3:4000', 'server4:4000']
