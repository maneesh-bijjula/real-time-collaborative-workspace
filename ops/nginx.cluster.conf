upstream collaboration {
    zone collaboration 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server server:4000 resolve max_fails=1 fail_timeout=2s;
    server server2:4000 resolve max_fails=1 fail_timeout=2s;
    server server3:4000 resolve max_fails=1 fail_timeout=2s;
    server server4:4000 resolve max_fails=1 fail_timeout=2s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    client_max_body_size 16k;
    location = /metrics { return 404; }
    location = /live { return 404; }
    location = /ready { return 404; }
    location / {
        proxy_pass http://collaboration;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
