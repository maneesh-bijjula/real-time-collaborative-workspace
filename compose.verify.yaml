# Disposable packaged-app verification. No ordinary application volume is used.
name: commonplace-verify
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace-local
      POSTGRES_DB: workspace_verify_test
    ports: ['127.0.0.1:15434:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workspace -d workspace_verify_test']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
  server:
    build: { context: ., target: server }
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://workspace:workspace-local@postgres:5432/workspace_verify_test
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
    ports: ['127.0.0.1:4100:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 4s
      retries: 30
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4100
        NEXT_PUBLIC_COLLABORATION_URL: ws://localhost:4100/collaboration
    ports: ['127.0.0.1:3100:3000']
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 4s
      retries: 30
