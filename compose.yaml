name: commonplace

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workspace-local}
      POSTGRES_DB: workspace
    ports: ['127.0.0.1:${POSTGRES_PORT:-5433}:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workspace -d workspace']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ['127.0.0.1:${REDIS_PORT:-6380}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build: { context: ., target: server }
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://workspace:${POSTGRES_PASSWORD:-workspace-local}@postgres:5432/workspace
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: ${REDIS_PREFIX:-commonplace}
      REDIS_RECONCILE_INTERVAL_MS: ${REDIS_RECONCILE_INTERVAL_MS:-2000}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
  web:
    build: { context: ., target: web }
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      server: { condition: service_healthy }
  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace-local
      POSTGRES_DB: workspace_test
    ports: ['127.0.0.1:5434:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workspace -d workspace_test']
      interval: 2s
      timeout: 3s
      retries: 20
  redis-test:
    image: redis:8-alpine
    profiles: ['test']
    ports: ['127.0.0.1:6381:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
